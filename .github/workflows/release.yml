name: Release package

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build, verify, attest, and attach package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: "22.22.0"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: >-
          node -e "const manifest=require('./package.json');
          if(process.env.GITHUB_REF_NAME !== 'v' + manifest.version) throw new
          Error('Release tag must match package version')"
      - name: Run release checks
        run: pnpm check
      - name: Verify clean package consumer
        run: pnpm package:verify
      - name: Build checksummed release artifacts
        run: pnpm package:release
      - name: Attest package and checksum provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with:
          subject-path: artifacts/*
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
